<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shop – Holzmanufaktur</title>
<!-- Supabase SDK -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--acc:#8b5a2b;--acc-d:#6b431f;--bg:#faf9f7;--line:#e5e1da;--text:#2a2521;--muted:#8a8078;--err:#c0392b}
*{box-sizing:border-box}
body{font-family:system-ui,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);margin:0}
header{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
.wrap{max-width:1000px;margin:0 auto;padding:0 20px}
nav{display:flex;justify-content:space-between;align-items:center;padding:16px 0}
.logo{font-weight:700;color:var(--acc-d);text-decoration:none;font-size:1.2rem}
.cart-link{color:var(--text);text-decoration:none;font-size:.95rem;font-weight:600;display:flex;gap:6px;align-items:center}
.cart-link:hover{color:var(--acc)}
.badge{background:var(--acc);color:#fff;border-radius:12px;padding:2px 8px;font-size:.75rem;min-width:24px;text-align:center}

h1{font-size:1.6rem;margin:32px 0 20px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:24px;padding-bottom:60px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;transition:transform .2s,box-shadow .2s;cursor:pointer;text-decoration:none;color:inherit}
.card:hover{transform:translateY(-4px);box-shadow:0 8px 24px rgba(0,0,0,.06)}
.thumb{background:#f1ede6;height:200px;display:flex;align-items:center;justify-content:center;font-size:5rem}
.info{padding:20px;display:flex;flex-direction:column;flex:1}
.name{font-weight:600;margin:0 0 8px;font-size:1.1rem}
.price{font-weight:700;color:var(--text);font-size:1.2rem;margin-bottom:20px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}

/* Rabattpreis-Anzeige (discount_price): Originalpreis durchgestrichen,
   Rabattpreis in der Akzentfarbe hervorgehoben, kleines Badge mit Prozent.
   Ohne discount_price bleibt .price wie bisher ein einfacher Textknoten. */
.price-original{text-decoration:line-through;color:var(--muted);font-weight:500;font-size:0.95rem}
.price-current{color:var(--err)}
.discount-badge{display:inline-block;background:var(--err);color:#fff;font-size:.7rem;font-weight:700;padding:3px 7px;border-radius:6px;line-height:1.3}

.actions{display:flex;flex-direction:column;gap:8px;margin-top:auto}
.btn{width:100%;background:#fff;color:var(--text);border:1px solid var(--line);padding:10px;border-radius:8px;font-weight:600;font-size:.9rem;cursor:pointer;transition:all .2s;text-align:center;text-decoration:none}
.btn-primary{background:var(--acc);color:#fff;border-color:var(--acc)}
.btn-primary:hover{background:var(--acc-d);color:#fff}
.btn-secondary:hover{border-color:var(--acc);color:var(--acc);background:#fcfbfa}

.loading{grid-column:1/-1;text-align:center;padding:60px 0;color:var(--muted);font-size:1.05rem}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(100px);background:#3f7d3f;color:#fff;padding:14px 28px;border-radius:8px;font-weight:600;font-size:.95rem;opacity:0;transition:all .3s ease;z-index:100;box-shadow:0 4px 12px rgba(0,0,0,.15)}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <nav>
      <a href="./" class="logo">🪵 Holzmanufaktur</a>
      <a href="warenkorb" class="cart-link">
        Warenkorb <span class="badge" id="cartCount">0</span>
      </a>
    </nav>
  </div>
</header>

<main class="wrap">
  <h1>Unsere Produkte</h1>
  <div id="grid" class="grid">
    <div class="loading">Produkte werden geladen…</div>
  </div>
</main>

<div id="toast" class="toast">✓ Zum Warenkorb hinzugefügt</div>

<script>
const SUPABASE_URL = 'https://keaahccmqnmvtcmabvvz.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtlYWFoY2NtcW5tdnRjbWFidnZ6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI2NjQwMjYsImV4cCI6MjA5ODI0MDAyNn0.njXGfpgYqplV5KqFB2QAwpFv8cl_EDsH5CTQBMEciPM';
const KEY = 'warenkorbItems';
const eur = n => (parseFloat(n) || 0).toFixed(2).replace('.', ',') + ' €';

/* ------------------------------------------------------------------------
   Zentrale Produkt-Rabattformel - identisch zu App.js/warenkorb.html, hier
   separat implementiert, da diese Seite ein eigenständiges Inline-Script
   ohne gemeinsames Modul-System nutzt:

     effectivePrice = discount_price != null ? discount_price : price

   Wird beim Rendern der Karten UND beim Hinzufügen zum Warenkorb benutzt,
   damit price nie versehentlich statt discount_price verwendet wird.
   ------------------------------------------------------------------------ */
function effectivePrice(p){
  const hasDiscount = p.discount_price!==null && p.discount_price!==undefined && p.discount_price!=='';
  return parseFloat(hasDiscount ? p.discount_price : p.price) || 0;
}
function isDiscounted(p){
  if(p.discount_price===null || p.discount_price===undefined || p.discount_price==='') return false;
  const d=parseFloat(p.discount_price), o=parseFloat(p.price);
  return !isNaN(d) && !isNaN(o) && d<o;
}

async function loadProducts() {
  const grid = document.getElementById('grid');
  
  try {
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    const { data, error } = await supabase.from('products').select('*');

    if (error) throw error;

    if (!data || data.length === 0) {
      grid.innerHTML = '<div class="loading">Keine Produkte gefunden.</div>';
      return;
    }

    // HTML für Produkte generieren mit Verlinkung auf products.html?id=...
    grid.innerHTML = data.map(p => {
      const discounted = isDiscounted(p);
      const effective = effectivePrice(p);
      const original = parseFloat(p.price) || 0;
      const percent = discounted && original > 0 ? Math.round((1 - effective / original) * 100) : 0;

      // Normales Produkt: Preis wie bisher als einfacher Text.
      // Reduziertes Produkt: durchgestrichener Original- + hervorgehobener
      // Rabattpreis + optionales Prozent-Badge.
      const priceHtml = discounted
        ? `<span class="price-original">${eur(original)}</span><span class="price-current">${eur(effective)}</span>${percent > 0 ? `<span class="discount-badge">-${percent}%</span>` : ''}`
        : eur(p.price);

      return `
      <div class="card" data-url="products.html?id=${p.id}">
        <div class="thumb">${p.icon || '📦'}</div>
        <div class="info">
          <h2 class="name">${p.name || 'Produkt'}</h2>
          <div class="price">${priceHtml}</div>
          <div class="actions">
            <button class="btn btn-primary add-btn" 
              data-id="${p.id}" 
              data-name="${escapeHtml(p.name)}" 
              data-price="${p.price || 0}" 
              data-discount-price="${p.discount_price != null ? p.discount_price : ''}"
              data-icon="${p.icon || '📦'}">
              In den Warenkorb
            </button>
            <a href="products.html?id=${p.id}" class="btn btn-secondary detail-btn">
              Details ansehen
            </a>
          </div>
        </div>
      </div>
    `;
    }).join('');

    // Klick auf die Karte führt zur Produktdetailseite
    document.querySelectorAll('.card').forEach(card => {
      card.addEventListener('click', (e) => {
        window.location.href = card.dataset.url;
      });
    });

    // Klick auf "In den Warenkorb" legt das Produkt in den Warenkorb ohne Weiterleitung
    document.querySelectorAll('.add-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation(); // Verhindert das Öffnen der Produktdetailseite beim Button-Klick
        const dataset = e.currentTarget.dataset;
        // Kleines "Produkt-ähnliches" Objekt aus den data-Attributen, damit
        // effectivePrice()/isDiscounted() dieselbe Formel wie überall sonst
        // im Shop anwenden können.
        const productLike = {
          price: dataset.price,
          discount_price: dataset.discountPrice !== '' ? dataset.discountPrice : null
        };
        addToCart({
          id: dataset.id,
          name: dataset.name,
          // price = tatsächlich zu zahlender Preis (Rabattpreis, falls vorhanden)
          price: effectivePrice(productLike),
          // nur gesetzt, wenn wirklich reduziert - rein für die durchgestrichene
          // Anzeige im Warenkorb/an der Kasse, niemals für die Berechnung
          originalPrice: isDiscounted(productLike) ? (parseFloat(dataset.price) || 0) : undefined,
          icon: dataset.icon
        });
      });
    });

    // Verhindert doppeltes Auslösen beim Klick auf "Details ansehen"
    document.querySelectorAll('.detail-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
      });
    });

  } catch (err) {
    console.error(err);
    grid.innerHTML = `<div class="loading" style="color:#c0392b">Fehler beim Laden der Produkte.</div>`;
  }
}

function escapeHtml(str) {
  return (str || '').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function addToCart(product) {
  let cart = JSON.parse(localStorage.getItem(KEY)) || [];
  let existingItem = cart.find(item => item.id === product.id);
  
  if (existingItem) {
    existingItem.qty = (existingItem.qty || 1) + 1;
  } else {
    cart.push({ ...product, qty: 1 });
  }
  
  localStorage.setItem(KEY, JSON.stringify(cart));
  updateCartBadge();
  showToast();
}

function updateCartBadge() {
  let cart = JSON.parse(localStorage.getItem(KEY)) || [];
  let totalItems = cart.reduce((sum, item) => sum + (item.qty || 1), 0);
  document.getElementById('cartCount').textContent = totalItems;
}

let toastTimeout;
function showToast() {
  const toast = document.getElementById('toast');
  toast.classList.add('show');
  clearTimeout(toastTimeout);
  toastTimeout = setTimeout(() => {
    toast.classList.remove('show');
  }, 2500);
}

// Initialer Aufruf
updateCartBadge();
loadProducts();
</script>
</body>
</html>
