<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shop – Holzmanufaktur</title>
<!-- Supabase SDK -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--acc:#8b5a2b;--acc-d:#6b431f;--bg:#faf9f7;--line:#e5e1da;--text:#2a2521;--muted:#8a8078}
*{box-sizing:border-box}
body{font-family:system-ui,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);margin:0}
header{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
.wrap{max-width:1000px;margin:0 auto;padding:0 20px}
nav{display:flex;justify-content:space-between;align-items:center;padding:16px 0}
.logo{font-weight:700;color:var(--acc-d);text-decoration:none;font-size:1.2rem}
.cart-link{color:var(--text);text-decoration:none;font-size:.95rem; font-weight:600; display:flex; gap:6px; align-items:center}
.cart-link:hover{color:var(--acc)}
.badge{background:var(--acc);color:#fff;border-radius:12px;padding:2px 8px;font-size:.75rem;min-width:24px;text-align:center}

h1{font-size:1.6rem;margin:32px 0 20px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:24px;padding-bottom:60px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;transition:transform .2s, box-shadow .2s}
.card:hover{transform:translateY(-4px);box-shadow:0 8px 24px rgba(0,0,0,.06)}
.thumb{background:#f1ede6;height:200px;display:flex;align-items:center;justify-content:center;font-size:5rem}
.info{padding:20px;display:flex;flex-direction:column;flex:1}
.name{font-weight:600;margin:0 0 8px;font-size:1.1rem}
.price{font-weight:700;color:var(--text);font-size:1.2rem;margin-bottom:20px}
.btn{margin-top:auto;width:100%;background:#fff;color:var(--text);border:1px solid var(--line);padding:12px;border-radius:8px;font-weight:600;font-size:.95rem;cursor:pointer;transition:all .2s}
.btn:hover{border-color:var(--acc);color:var(--acc)}
.btn:active{background:#f7f0e8}

/* Benachrichtigung beim Hinzufügen */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(100px);background:#3f7d3f;color:#fff;padding:14px 28px;border-radius:8px;font-weight:600;font-size:.95rem;opacity:0;transition:all .3s ease;z-index:100;box-shadow:0 4px 12px rgba(0,0,0,.15)}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <nav>
      <a href="index.html" class="logo">🪵 Holzmanufaktur</a>
      <a href="warenkorb.html" class="cart-link">
        Warenkorb <span class="badge" id="cartCount">0</span>
      </a>
    </nav>
  </div>
</header>

<main class="wrap">
  <h1>Unsere Produkte</h1>
  <div id="grid" class="grid">
    <div style="color:var(--muted); grid-column: 1 / -1;">Produkte werden geladen...</div>
  </div>
</main>

<div id="toast" class="toast">✓ Zum Warenkorb hinzugefügt</div>

<script>
// Supabase einbinden
const SUPABASE_URL = 'https://keaahccmqnmvtcmabvvz.supabase.co';
const SUPABASE_KEY = 'Sb_publishable_hrgd2mvl4QpK7X2tvImhcw_9fsVhV4J';
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const KEY = 'warenkorbItems';
const eur = n => n.toFixed(2).replace('.', ',') + ' €';

// Produkte aus der Datenbank laden
async function loadProducts() {
  const { data, error } = await supabase.from('products').select('*');
  const grid = document.getElementById('grid');
  
  if (error) {
    grid.innerHTML = '<div style="color:#c0392b">Fehler beim Laden der Produkte.</div>';
    console.error(error);
    return;
  }
  
  if (!data || data.length === 0) {
    grid.innerHTML = '<div style="color:var(--muted)">Noch keine Produkte vorhanden. Füge welche im Supabase Table Editor hinzu!</div>';
    return;
  }

  // HTML für jedes Produkt generieren
  grid.innerHTML = data.map(p => `
    <div class="card">
      <div class="thumb">${p.icon || '📦'}</div>
      <div class="info">
        <h2 class="name">${p.name}</h2>
        <div class="price">${eur(p.price)}</div>
        <button class="btn" onclick="addToCart('${p.id}', '${p.name}', ${p.price}, '${p.icon}')">
          In den Warenkorb
        </button>
      </div>
    </div>
  `).join('');
  
  updateCartBadge();
}

// In den Warenkorb legen
function addToCart(id, name, price, icon) {
  let cart = JSON.parse(localStorage.getItem(KEY)) || [];
  
  // Prüfen ob das Produkt schon im Warenkorb ist
  let existingItem = cart.find(item => item.id === id);
  if (existingItem) {
    existingItem.qty = (existingItem.qty || 1) + 1;
  } else {
    cart.push({ id, name, price, icon, qty: 1 });
  }
  
  // Im LocalStorage speichern
  localStorage.setItem(KEY, JSON.stringify(cart));
  
  updateCartBadge();
  showToast();
}

// Zähler oben rechts im Menü aktualisieren
function updateCartBadge() {
  let cart = JSON.parse(localStorage.getItem(KEY)) || [];
  let totalItems = cart.reduce((sum, item) => sum + (item.qty || 1), 0);
  document.getElementById('cartCount').textContent = totalItems;
}

// Kleine Animation (Benachrichtigung), wenn etwas hinzugefügt wurde
let toastTimeout;
function showToast() {
  const toast = document.getElementById('toast');
  toast.classList.add('show');
  clearTimeout(toastTimeout);
  toastTimeout = setTimeout(() => {
    toast.classList.remove('show');
  }, 2500);
}

// Beim Start der Seite direkt die Produkte laden
loadProducts();
</script>
</body>
</html>
