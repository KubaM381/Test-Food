<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Content Security Policy für Frontend-Sicherheit -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' https://picsum.photos https://*.picsum.photos data:; style-src 'self' 'unsafe-inline'; script-src 'self';">
  <title>Produktdetails</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Kopfzeile / Navigation -->
  <header class="header">
    <div class="container header-inner">
      <button id="backBtn" class="btn-icon" aria-label="Zurück">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      </button>
      <span class="brand-logo">Shop</span>
      <button id="cartBtn" class="btn-icon" aria-label="Warenkorb">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4zM3 6h18M16 10a4 4 0 01-8 0"/></svg>
        <span id="cartBadge" class="badge" hidden>0</span>
      </button>
    </div>
  </header>

  <!-- Hauptinhalt der Produktseite -->
  <main class="container">
    
    <!-- Produktansicht (wird von app.js befüllt) -->
    <article id="productView" class="product-grid" hidden>
      <div class="product-gallery">
        <img id="productImage" class="product-image" src="" alt="Produktbild">
      </div>

      <div class="product-details">
        <h1 id="productName" class="product-title"></h1>
        
        <div class="rating-container">
          <span class="stars">★★★★★</span>
          <span id="ratingValue" class="rating-val"></span>
          <span id="reviewCount" class="review-count"></span>
        </div>

        <div id="productPrice" class="price-tag"></div>
        <p id="productDescription" class="description-text"></p>

        <!-- Mengenauswahl -->
        <div class="quantity-section">
          <label class="section-label">Menge auswählen:</label>
          <div class="quantity-controls">
            <div class="qty-picker">
              <button id="qtyMinus" class="qty-btn" aria-label="Menge verringern">-</button>
              <span id="qtyValue" class="qty-val">1</span>
              <button id="qtyPlus" class="qty-btn" aria-label="Menge erhöhen">+</button>
            </div>
            <div class="chip-group">
              <button class="chip is-active" data-qty="1" aria-pressed="true">1</button>
              <button class="chip" data-qty="2" aria-pressed="false">2</button>
              <button class="chip" data-qty="5" aria-pressed="false">5</button>
            </div>
          </div>
        </div>

        <!-- Highlights / Features -->
        <div class="features-section">
          <label class="section-label">Highlights:</label>
          <ul id="featuresList" class="features-list"></ul>
        </div>
      </div>
    </article>

    <!-- Anzeige, falls ein Produkt nicht gefunden wird -->
    <div id="notFoundView" class="not-found" hidden>
      <h2>Produkt nicht gefunden</h2>
      <p>Das angeforderte Produkt existiert leider nicht.</p>
    </div>

  </main>

  <!-- Untere Aktionsleiste (Kaufen-Button) -->
  <aside id="actionBar" class="action-bar" hidden>
    <div class="container action-inner">
      <button id="buyBtn" class="btn-primary">
        <span id="buyBtnLabel">In den Warenkorb</span>
      </button>
    </div>
  </aside>

  <!-- Einbindung der Logik -->
  <script src="app.js"></script>
</body>
</html>
