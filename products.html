<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Produktdetails – Holzmanufaktur</title>
  <link rel="stylesheet" href="style.css">
  
  <!-- Supabase SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- App Script -->
  <script src="app.js" defer></script>
</head>
<body>
  <header class="header">
    <button id="backBtn" class="icon-btn" aria-label="Zurück">←</button>
    <h1 class="header-title">Shop</h1>
    <button id="cartBtn" class="icon-btn cart-btn" aria-label="Warenkorb">
      🛒
      <span id="cartBadge" class="badge" hidden>0</span>
    </button>
  </header>

  <main class="main-container">
    <!-- Fehleransicht -->
    <div id="notFoundView" class="not-found" hidden>
      <h2>Produkt nicht gefunden</h2>
      <p>Das angeforderte Produkt existiert leider nicht.</p>
      <a href="index.html" class="btn btn-secondary">Zurück zur Übersicht</a>
    </div>

    <!-- Hauptansicht Produkt -->
    <div id="productView" class="product-card">
      <div class="image-wrapper">
        <img id="productImage" src="" alt="Produktbild" class="product-image">
      </div>

      <div class="product-details">
        <h2 id="productName" class="product-title">...</h2>

        <div class="rating-row">
          <span class="stars">★★★★★</span>
          <span id="ratingValue" class="rating-value">5.0</span>
          <span id="reviewCount" class="review-count">(0)</span>
        </div>

        <div id="productPrice" class="product-price">0,00 €</div>

        <p id="productDescription" class="product-description"></p>

        <div class="section-title">MENGE AUSWÄHLEN:</div>
        <div class="quantity-controls">
          <div class="qty-picker">
            <button id="qtyMinus" class="qty-btn" aria-label="Menge verringern">-</button>
            <span id="qtyValue" class="qty-value">1</span>
            <button id="qtyPlus" class="qty-btn" aria-label="Menge erhöhen">+</button>
          </div>
          <div class="chips-group">
            <button class="chip is-active" data-qty="1">1</button>
            <button class="chip" data-qty="2">2</button>
            <button class="chip" data-qty="5">5</button>
          </div>
        </div>

        <div class="section-title">HIGHLIGHTS:</div>
        <ul id="featuresList" class="features-list"></ul>
      </div>
    </div>
  </main>

  <footer id="actionBar" class="action-bar">
    <button id="buyBtn" class="btn btn-primary buy-btn">
      <span id="buyBtnLabel">In den Warenkorb</span>
    </button>
  </footer>
</body>
</html>
