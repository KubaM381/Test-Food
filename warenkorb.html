<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Warenkorb – Holzmanufaktur</title>
<link rel="stylesheet" href="style.css">
<!-- Supabase SDK: wird benötigt für (a) die dynamischen Empfehlungen
     (products.recommended = true) und (b) die Validierung von Rabattcodes
     über die bereits vorhandene sichere Edge-Function "validate-discount". -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<header><div class="header-wrap"><nav>
<a href="index.html" class="cart-icon-btn nav-back-icon" aria-label="Weiter einkaufen" title="Weiter einkaufen">
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="11 18 5 12 11 6"/></svg>
</a>
<span class="nav-spacer" aria-hidden="true"></span>
<a href="index.html" class="logo" style="justify-self:end">🪵 Holzmanufaktur</a>
</nav></div></header>

<main class="wrap" id="cartMain">
<h1>Dein Warenkorb</h1>
<div class="layout" id="layout">
  <div>
    <div class="section" id="progressBox" style="display:none">
      <p class="progress-msg" id="progressMsg"></p>
      <div class="progress-track">
        <div class="progress-fill" id="progressFill"></div>
        <div class="progress-mark" id="markShip" style="left:50%">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="7" width="12" height="9" rx="1"/><path d="M13 10h4.5L21 13.5V16h-8"/><circle cx="5.5" cy="17.5" r="1.6"/><circle cx="16.5" cy="17.5" r="1.6"/></svg>
        </div>
        <div class="progress-mark end" id="markGift">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="9" width="18" height="12" rx="1"/><path d="M3 13h18"/><path d="M12 9v12"/><path d="M12 9c-1.5-4-6-4.5-6-1.5 0 1.5 1.5 1.5 3 1.5"/><path d="M12 9c1.5-4 6-4.5 6-1.5 0 1.5-1.5 1.5-3 1.5"/></svg>
        </div>
      </div>
    </div>
    <div class="section" id="list"></div>
    <div class="section recommend" id="recommendBox">
      <div class="recommend-head">
        <p class="recommend-title">Damit dein neues Stück lange schön bleibt</p>
        <p class="recommend-sub">Ergänze deine Bestellung mit dieser kleinen Pflege-Empfehlung</p>
      </div>
      <div class="recommend-list" id="recommendCard"></div>
    </div>
  </div>
  <div class="summary" id="summary" style="display:none">
    <h2>Bestellübersicht</h2>
    <div class="discount">
      <input type="text" id="discountInput" placeholder="Rabattcode">
      <button id="discountBtn" onclick="applyDiscount()">Anwenden</button>
    </div>
    <p class="discount-msg" id="discountMsg" style="display:none"></p>
    <div class="row"><span>Zwischensumme</span><span id="sub">0,00 €</span></div>
    <div class="row" id="discountRow" style="display:none"><span id="discountLabel">Rabatt</span><span id="discountAmount"></span></div>
    <div class="row"><span>Versand</span><span id="ship">0,00 €</span></div>
    <div class="row total"><span>Gesamt</span><span id="total">0,00 €</span></div>
    <button class="checkout-btn" onclick="location.href='kasse.html'">Zur Kasse</button>
    <div class="trust">🔒 Sichere Bezahlung – SSL-verschlüsselte Verbindung</div>
  </div>
</div>
</main>

<script>
const KEY='warenkorbItems', DISCOUNT_KEY='warenkorbRabattCode', FREE_SHIP=50, GIFT_AT=100, SHIP_COST=4.95, MAX_QTY=1000;

// Rabatt-Zustand: die Quelle ist AUSSCHLIESSLICH die Antwort der
// "validate-discount"-Edge-Function. Es gibt hier keine lokale Coupon-Liste
// und keinen lokal hinterlegten Prozentsatz mehr.
let discountCode='';   // vom Server bestätigter Code (Anzeige/Checkout)
let discountType=null; // 'percent' | 'fixed' - kommt 1:1 vom Server
let discountValue=0;   // Rohwert vom Server (z.B. 10 für 10%, oder 5 für 5,00€)

// Supabase wird lesend für die Empfehlungen (products.recommended = true)
// und für den Aufruf der sicheren "validate-discount"-Edge-Function verwendet.
// Preise/Rabatte/Versand werden weiterhin serverseitig über die
// Checkout-Edge-Function berechnet - daran ändert sich hier nichts.
const SUPABASE_URL='https://keaahccmqnmvtcmabvvz.supabase.co';
const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtlYWFoY2NtcW5tdnRjbWFidnZ6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI2NjQwMjYsImV4cCI6MjA5ODI0MDAyNn0.njXGfpgYqplV5KqFB2QAwpFv8cl_EDsH5CTQBMEciPM';
let supabaseClient=null;
function getSupabase(){
  if(!supabaseClient) supabaseClient=window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  return supabaseClient;
}

// Cache der aktuell in Supabase als "recommended" markierten Produkte.
// Wird einmal beim Laden der Seite geholt; die Anzahl ist bewusst nicht
// begrenzt - es werden immer genau die Produkte angezeigt, bei denen in
// Supabase der Haken bei "recommended" gesetzt ist.
let recommendedProducts=[];
async function loadRecommendedProducts(){
  try{
    const { data, error } = await getSupabase().from('products').select('*').eq('recommended', true);
    if(error) throw error;
    recommendedProducts = data || [];
  }catch(err){
    console.error('Fehler beim Laden der Empfehlungen:', err);
    recommendedProducts = [];
  }
}

const eur=n=>(parseFloat(n)||0).toFixed(2).replace('.',',')+' €';

// Option 1 Icon: Beide Schnüre schwingen nach links
const SURPRISE_ICON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="width:1.2em;height:1.2em;vertical-align:-3px;margin-right:6px"><path d="M8.5 3C6 3 4 5.2 4 8c0 3.5 4.5 7.5 4.5 7.5S13 11.5 13 8c0-2.8-2-5-4.5-5z"/><path d="M14.5 6c1.9 0 3.5 1.6 3.5 3.8 0 2.8-3.5 5.7-3.5 5.7s-1.3-1.1-2.3-2.5"/><path d="M8.5 15.5l-0.8 1.5h1.6z"/><path d="M7.7 17c-1 2-2 3-3.2 4"/><path d="M14.5 15.5l-0.8 1.5h1.6z"/><path d="M13.7 17c-1 2-2 3-3.2 4"/></svg>';

const load=()=>JSON.parse(localStorage.getItem(KEY))||[];
const save=c=>localStorage.setItem(KEY,JSON.stringify(c));

function mergeDuplicates(cart){
  const map=new Map();
  cart.forEach(it=>{
    if(map.has(it.name)) map.get(it.name).qty = Math.min(MAX_QTY, map.get(it.name).qty + (it.qty||1));
    else map.set(it.name,{...it, qty:Math.min(MAX_QTY, it.qty||1)});
  });
  return [...map.values()];
}

// Setzt den Rabatt-Zustand vollständig zurück und entfernt den gespeicherten
// Code. Wird bei ungültigem/abgelaufenem Code und bei leerem Warenkorb genutzt.
function resetDiscount(){
  discountCode='';
  discountType=null;
  discountValue=0;
  localStorage.removeItem(DISCOUNT_KEY);
}

// Berechnet den Rabattbetrag ausschließlich aus den vom Server gelieferten
// Werten (discountType/discountValue). Keine lokal hinterlegten Prozentsätze.
function computeDiscountAmount(rawSub){
  if(!discountType || !discountValue) return 0;
  const amt = discountType==='fixed' ? discountValue : rawSub*(discountValue/100);
  return Math.max(0, Math.min(amt, rawSub));
}

// Ruft die bereits vorhandene sichere Edge-Function "validate-discount" auf
// und liefert bei Erfolg { code, type, value } zurück, sonst null.
async function checkDiscountCode(code){
  const { data, error } = await getSupabase().functions.invoke('validate-discount', { body: { code } });
  if(error) throw error;
  if(!data || data.valid===false || data.error) return null;
  return {
    code: data.code || code,
    type: data.type,
    value: Number(data.value)||0
  };
}

async function applyDiscount(){
  const val=document.getElementById('discountInput').value.trim().toUpperCase();
  const msg=document.getElementById('discountMsg');
  const btn=document.getElementById('discountBtn');

  if(!val){
    resetDiscount();
    msg.style.display='none';
    render();
    return;
  }

  btn.disabled=true;
  try{
    const result=await checkDiscountCode(val);
    if(!result) throw new Error('Code ungültig');

    discountCode=result.code;
    discountType=result.type;
    discountValue=result.value;
    localStorage.setItem(DISCOUNT_KEY, discountCode);

    msg.textContent = discountType==='fixed'
      ? `Code „${discountCode}" wurde erfolgreich angewendet (−${eur(discountValue)}).`
      : `Code „${discountCode}" wurde erfolgreich angewendet (-${discountValue}%).`;
    msg.style.color='#3f7d3f';
  }catch(err){
    console.error('Rabattcode konnte nicht validiert werden:', err);
    resetDiscount();
    msg.textContent='Dieser Code ist leider ungültig.';
    msg.style.color='#c0392b';
  }
  msg.style.display='block';
  btn.disabled=false;
  render();
}

function sizeQty(el){
  const len=String(el.value).length;
  el.style.width=Math.max(2.5, len+0.8)+'ch';
}

function onQtyInput(el, i){
  sizeQty(el);

  const raw=parseInt(el.value,10);
  if(isNaN(raw)) return; // Feld gerade leer/im Tippen – onchange korrigiert das später

  let val=raw;
  if(val>MAX_QTY){ val=MAX_QTY; el.value=MAX_QTY; sizeQty(el); }
  val=Math.max(1,val);

  const cart=mergeDuplicates(load());
  cart[i].qty=val;
  save(cart);

  const itemEl=el.closest('.item');
  itemEl.querySelector('.price').textContent=eur(cart[i].price*val);
  itemEl.querySelector('.qty button:last-child').disabled = val>=MAX_QTY;
  itemEl.querySelector('.qty-error').classList.toggle('show', val>=MAX_QTY);
  itemEl.classList.toggle('limit-active', val>=MAX_QTY);

  updateSummary(cart);
}

// Zeigt alle aktuell als "recommended" markierten Supabase-Produkte an,
// die noch nicht im Warenkorb liegen. Abgleich erfolgt über die echte
// Produkt-ID (Fallback: Name, falls ein Artikel z. B. noch ohne ID im
// Warenkorb liegt).
function renderRecommendation(cart){
  const box=document.getElementById('recommendBox');
  if(cart.length!==1){ box.style.display='none'; return; }

  const cartIds=new Set(cart.map(it=>String(it.id)));
  const cartNames=new Set(cart.map(it=>it.name));
  const options=recommendedProducts.filter(p=>!cartIds.has(String(p.id)) && !cartNames.has(p.name));

  if(!options.length){ box.style.display='none'; return; }

  // Es soll immer nur genau eine Empfehlung angezeigt werden, auch wenn in
  // Supabase mehrere Produkte "recommended = true" haben - daher wird hier
  // bewusst nur die erste passende Option gerendert, der Rest bleibt ungenutzt.
  const pick=options[0];

  document.getElementById('recommendCard').innerHTML=`
    <div class="recommend-card">
      <div class="recommend-main">
        <div class="thumb">${pick.icon||'📦'}</div>
        <div class="recommend-info">
          <p class="name">${pick.name||'Produkt'}</p>
          <p class="unit">${eur(pick.price)}</p>
        </div>
      </div>
      <button class="recommend-add" data-id="${pick.id}">In den Warenkorb</button>
    </div>`;

  document.querySelectorAll('#recommendCard .recommend-add').forEach(btn=>{
    btn.addEventListener('click', ()=>addRecommendation(btn.dataset.id));
  });

  box.style.display='block';
}

// Übernimmt das echte Supabase-Produkt (inkl. echter id) in den Warenkorb,
// damit der sichere Checkout später mit den korrekten Produktdaten arbeiten kann.
function addRecommendation(id){
  const pick=recommendedProducts.find(p=>String(p.id)===String(id));
  if(!pick) return;
  const cart=load();
  const existing=cart.find(it=>String(it.id)===String(pick.id) || it.name===pick.name);
  if(existing) existing.qty=Math.min(MAX_QTY, (existing.qty||1)+1);
  else cart.push({id:pick.id, name:pick.name, price:parseFloat(pick.price)||0, icon:pick.icon||'📦', qty:1});
  save(cart);
  render();
}

function render(){
  let cart=mergeDuplicates(load());
  save(cart);
  const list=document.getElementById('list'), sum=document.getElementById('summary'), pbox=document.getElementById('progressBox'), layout=document.getElementById('layout');
  if(!cart.length){
    // Ohne Artikel gibt es nichts zu rabattieren - Code mit aufräumen,
    // damit kein "verwaister" Rabatt beim nächsten Einkauf auftaucht.
    resetDiscount();
    layout.classList.add('is-empty');
    list.innerHTML=`
      <div class="empty">
        <div class="empty-icon">
          <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 7h12l-1 13H7L6 7Z"/><path d="M9 7V5a3 3 0 0 1 6 0v2"/><line x1="6" y1="7" x2="18" y2="7"/></svg>
        </div>
        <p class="empty-title">Dein Warenkorb ist noch leer</p>
        <p class="empty-sub">Entdecke unsere handgefertigten Holzprodukte und finde dein neues Lieblingsstück.</p>
        <a href="index.html" class="empty-btn">Produkte entdecken</a>
      </div>`;
    sum.style.display='none'; pbox.style.display='none'; document.getElementById('recommendBox').style.display='none';
    return;
  }
  layout.classList.remove('is-empty');
  sum.style.display='block'; pbox.style.display='block';

  list.innerHTML=cart.map((it,i)=>`
    <div class="item ${it.qty>=MAX_QTY?'limit-active':''}">
      <div class="item-main">
        <button class="remove" onclick="removeItem(${i})" title="Entfernen">✕</button>
        <div class="thumb">${it.icon||'📦'}</div>
        <div class="info"><p class="name">${it.name}</p><p class="unit">${eur(it.price)} / Stk.</p></div>
      </div>
      <div class="item-actions">
        <div class="qty-field">
          <div class="qty">
            <button onclick="changeQty(${i},-1)">−</button>
            <input type="number" inputmode="numeric" min="1" max="${MAX_QTY}" value="${it.qty}" oninput="onQtyInput(this, ${i})" onchange="setQty(${i}, this.value)">
            <button onclick="changeQty(${i},1)" ${it.qty>=MAX_QTY?'disabled':''}>+</button>
          </div>
          <p class="qty-error ${it.qty>=MAX_QTY?'show':''}"><span>Maximal 1.000 Stück</span><span>pro Artikel möglich</span></p>
        </div>
        <div class="price">${eur(it.price*it.qty)}</div>
      </div>
    </div>`).join('');

  list.querySelectorAll('.qty input').forEach(sizeQty);
  renderRecommendation(cart);
  updateSummary(cart);
}

function updateSummary(cart){
  const rawSub=cart.reduce((s,it)=>s+it.price*it.qty,0);
  const discountAmount=computeDiscountAmount(rawSub);
  const sub=rawSub-discountAmount;
  const ship=rawSub>=FREE_SHIP?0:SHIP_COST;

  document.getElementById('sub').textContent=eur(rawSub);
  const dRow=document.getElementById('discountRow');
  if(discountAmount>0){
    dRow.style.display='flex';
    document.getElementById('discountLabel').textContent=`Rabatt (${discountCode})`;
    document.getElementById('discountAmount').textContent='−'+eur(discountAmount);
  }
  else dRow.style.display='none';

  const shipEl=document.getElementById('ship');
  shipEl.textContent=ship===0?'Kostenlos':eur(ship);
  shipEl.className=ship===0?'free-ship':'';
  document.getElementById('total').textContent=eur(sub+ship);

  const pct=Math.min(100, rawSub/GIFT_AT*100);
  document.getElementById('progressFill').style.width=pct+'%';
  document.getElementById('markShip').classList.toggle('reached', rawSub>=FREE_SHIP);
  document.getElementById('markGift').classList.toggle('reached', rawSub>=GIFT_AT);
  const pmsg=document.getElementById('progressMsg');
  if(rawSub>=GIFT_AT) pmsg.innerHTML=`${SURPRISE_ICON}Exklusive Überraschung freigeschaltet!`;
  else if(rawSub>=FREE_SHIP) pmsg.textContent=`✓ Kostenloser Versand gesichert – nur noch ${eur(GIFT_AT-rawSub)} bis zu deiner exklusiven Überraschung!`;
  else pmsg.textContent=`Nur noch ${eur(FREE_SHIP-rawSub)} bis zum kostenlosen Versand`;
}

function changeQty(i,d){ const c=mergeDuplicates(load()); c[i].qty=Math.max(1,Math.min(MAX_QTY,c[i].qty+d)); save(c); render(); }

function setQty(i,val,refocus){
  const c=mergeDuplicates(load());
  let q=parseInt(val,10);
  if(isNaN(q)||q<1) q=1;
  if(q>MAX_QTY) q=MAX_QTY;
  c[i].qty=q;
  save(c);
  render();
  if(refocus){
    const input=document.querySelectorAll('.qty input')[i];
    if(input){
      input.focus();
      input.setSelectionRange(input.value.length, input.value.length);
    }
  }
}

function removeItem(i){ const c=mergeDuplicates(load()); c.splice(i,1); save(c); render(); }

// Zuvor angewendeten Rabattcode wiederherstellen (z.B. nach Rücksprung aus
// der Kasse). WICHTIG: Der gespeicherte Code wird NICHT gegen eine lokale
// Liste geprüft, sondern erneut live über "validate-discount" validiert.
// Ist er nicht mehr gültig/abgelaufen/aufgebraucht, wird er entfernt und es
// wird kein Rabatt angezeigt - es gibt keinerlei lokalen Fallback.
async function restoreDiscount(){
  const stored=(localStorage.getItem(DISCOUNT_KEY)||'').toUpperCase();
  if(!stored) return;

  const msg=document.getElementById('discountMsg');
  try{
    const result=await checkDiscountCode(stored);
    if(!result) throw new Error('Code nicht mehr gültig');

    discountCode=result.code;
    discountType=result.type;
    discountValue=result.value;

    const input=document.getElementById('discountInput');
    if(input) input.value=discountCode;
    if(msg){
      msg.textContent = discountType==='fixed'
        ? `Code „${discountCode}" ist weiterhin aktiv (−${eur(discountValue)}).`
        : `Code „${discountCode}" ist weiterhin aktiv (-${discountValue}%).`;
      msg.style.color='#3f7d3f';
      msg.style.display='block';
    }
  }catch(err){
    console.error('Gespeicherter Rabattcode ist nicht mehr gültig:', err);
    resetDiscount();
    if(msg) msg.style.display='none';
  }
}

render();

// Gespeicherten Rabattcode serverseitig neu validieren und die Anzeige danach
// aktualisieren. Der Warenkorb selbst wird sofort (oben) angezeigt, damit es
// dafür keine Wartezeit gibt.
restoreDiscount().then(()=>{
  render();
});

// Empfehlungen aus Supabase laden. Der Warenkorb wird sofort gerendert (oben),
// damit es keine Wartezeit für die eigentliche Kernfunktion gibt; sobald die
// Empfehlungen geladen sind, wird nur der Empfehlungsbereich aktualisiert.
loadRecommendedProducts().then(()=>{
  renderRecommendation(mergeDuplicates(load()));
});
</script>
</body>
</html>
