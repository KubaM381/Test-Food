<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Warenkorb – Holzmanufaktur</title>
<style>
:root{--acc:#8b5a2b;--acc-d:#6b431f;--bg:#faf9f7;--line:#e5e1da;--text:#2a2521;--muted:#8a8078}
*{box-sizing:border-box}
body{font-family:system-ui,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);margin:0}
header{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
.wrap{max-width:1000px;margin:0 auto;padding:0 20px}
nav{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;padding:16px 0}
.logo{justify-self:center;font-weight:700;color:var(--acc-d);text-decoration:none;font-size:1.15rem;white-space:nowrap}
.nav-back{justify-self:start;color:var(--text);text-decoration:none;font-size:.88rem}
.nav-back:hover{color:var(--acc)}
.cart-icon-btn{justify-self:end;position:relative;width:40px;height:40px;border-radius:50%;border:1.5px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:center;color:var(--text);text-decoration:none;flex:0 0 auto;transition:border-color .15s,color .15s}
.cart-icon-btn:hover{border-color:var(--acc);color:var(--acc-d)}
.cart-icon-btn.nav-back-icon{justify-self:start}
.nav-spacer{width:40px;height:40px;justify-self:end}
.cart-badge{position:absolute;top:-4px;right:-4px;background:var(--acc);color:#fff;font-size:.62rem;font-weight:700;min-width:17px;height:17px;border-radius:50%;display:flex;align-items:center;justify-content:center;padding:0 3px;line-height:1}
@media(max-width:480px){.logo{font-size:1rem}.nav-back{font-size:.78rem}}
h1{font-size:1.6rem;margin:32px 0 20px}
.layout{display:grid;grid-template-columns:1fr 320px;gap:32px;align-items:start;padding-bottom:60px}
@media(max-width:760px){.layout{grid-template-columns:1fr;gap:16px}}

/* Saubere Trennlinien & kompakte Abstände */
.section{padding:12px 0}
.section + .section{border-top:1px solid var(--line)}
#list{padding:0}

.progress-msg{font-size:.9rem;margin:0 0 10px;font-weight:600;display:flex;align-items:center}
.progress-track{position:relative;height:8px;background:#f1ede6;border-radius:99px}
.progress-fill{height:100%;background:var(--acc);border-radius:99px;transition:width .4s ease}
.progress-mark{position:absolute;top:-6px;width:20px;height:20px;border-radius:50%;background:var(--bg);border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:.7rem;transform:translateX(-50%)}
.progress-mark.end{left:auto;right:0;transform:none}
.progress-mark.reached{border-color:var(--acc);background:var(--acc)}
.progress-mark svg{width:12px;height:12px;color:var(--muted);transition:color .2s}
.progress-mark.reached svg{color:#fff}

.item{display:flex;flex-wrap:wrap;align-items:center;gap:14px;padding:16px 0}
.item+.item{border-top:1px solid var(--line)}
.item.limit-active{padding-bottom:50px}
.item-main{display:flex;align-items:center;gap:16px;flex:1 1 220px;min-width:0}
.remove{flex:0 0 auto;width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:#fff;color:var(--muted);cursor:pointer;font-size:1rem;line-height:1;display:flex;align-items:center;justify-content:center}
.remove:hover{background:#fcebea;border-color:#e3a7a1;color:#c0392b}
.thumb{flex:0 0 auto;width:64px;height:64px;border-radius:8px;background:#f1ede6;display:flex;align-items:center;justify-content:center;font-size:1.5rem}
.info{min-width:0}
.name{font-weight:600;margin:0 0 4px}
.unit{color:var(--muted);font-size:.85rem;margin:0}
.item-actions{display:flex;align-items:center;gap:22px;margin-left:auto}

/* Mengenauswahl */
.qty{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.qty button{width:30px;height:34px;border:none;background:#fff;cursor:pointer;font-size:.95rem;color:var(--muted);flex:0 0 auto}
.qty button:hover{color:var(--text)}
.qty button:disabled{opacity:.35;cursor:default}
.qty button:disabled:hover{color:var(--muted)}
.qty input{height:34px;width:2.5ch;min-width:2.5ch;text-align:center;font-size:.9rem;border:none;background:#fff;padding:0;color:var(--text);-moz-appearance:textfield}
.qty input::-webkit-outer-spin-button,.qty input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.qty input:focus{outline:none;background:#f7f4ef}
.price{font-weight:700;min-width:70px;text-align:right}

/* Fehlermeldung zentriert schwebend unter dem Mengenfeld */
.qty-field{position:relative}
.qty-error{position:absolute;top:calc(100% + 6px);left:50%;transform:translateX(-50%);width:150px;display:none;margin:0;font-size:.72rem;line-height:1.35;color:#c0392b;text-align:center;pointer-events:none;z-index:5}
.qty-error span{display:block}
.qty-error.show{display:block}
@media(max-width:480px){.item-actions{width:100%;justify-content:space-between;margin-left:0}.qty-error{left:0;transform:none;text-align:left}}

@media(min-width:761px){
  #list{min-height:230px}
  .thumb{width:76px;height:76px;font-size:1.75rem;border-radius:10px}
  .item{padding:20px 0}
  .name{font-size:1.05rem}
}

/* Symmetrische Abstände für die Empfehlungskarte */
.recommend{display:none;padding:12px 0}
.recommend-head{margin:0 0 14px}
.recommend-title{font-weight:700;font-size:1rem;margin:0 0 2px}
.recommend-sub{color:var(--muted);font-size:.85rem;margin:0}
.recommend-card{display:flex;align-items:center;gap:16px;background:#faf8f4;border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.recommend-card .thumb{width:52px;height:52px;font-size:1.3rem;background:#fff;border:1px solid var(--line)}
.recommend-info{flex:1;min-width:0}
.recommend-info .name{font-size:.95rem}
.recommend-info .unit{margin-top:2px}
.recommend-add{flex:0 0 auto;background:#fff;border:1.5px solid var(--acc);color:var(--acc-d);font-weight:600;font-size:.85rem;padding:9px 16px;border-radius:8px;cursor:pointer;white-space:nowrap}
.recommend-add:hover{background:var(--acc);color:#fff}

.summary{padding:0}
@media(min-width:761px){.summary{border-left:1px solid var(--line);padding-left:32px}}
@media(max-width:760px){.summary{border-top:1px solid var(--line);padding-top:20px;margin-top:0}}
.summary h2{font-size:1.1rem;margin:0 0 16px}
.discount{display:flex;gap:8px;margin-bottom:16px}
.discount input{flex:1;padding:9px 10px;border:1px solid var(--line);border-radius:6px;font-size:.88rem}
.discount button{padding:9px 14px;border:1px solid var(--acc);background:#fff;color:var(--acc-d);border-radius:6px;font-weight:600;font-size:.85rem;cursor:pointer}
.discount button:hover{background:#f7f0e8}
.discount-msg{font-size:.8rem;margin:-8px 0 14px}
.row{display:flex;justify-content:space-between;font-size:.92rem;margin-bottom:10px;color:var(--muted)}
.row.total{color:var(--text);font-weight:700;font-size:1.15rem;border-top:1px solid var(--line);padding-top:14px;margin-top:14px}
.free-ship{color:#3f7d3f;font-weight:600}
.checkout-btn{width:100%;background:var(--acc);color:#fff;border:none;padding:14px;border-radius:8px;font-weight:700;font-size:1rem;cursor:pointer;margin-top:16px}
.checkout-btn:hover{background:var(--acc-d)}
.trust{font-size:.78rem;color:var(--muted);text-align:center;margin-top:12px}
.empty{text-align:center;padding:70px 20px}
.empty-icon{margin-bottom:14px;display:flex;justify-content:center;color:var(--muted)}
.empty-title{font-weight:700;font-size:1.15rem;margin:0 0 8px}
.empty-sub{color:var(--muted);font-size:.92rem;margin:0 0 24px;max-width:360px;margin-left:auto;margin-right:auto}
.empty-btn{display:inline-block;background:var(--acc);color:#fff;text-decoration:none;font-weight:700;font-size:.95rem;padding:12px 28px;border-radius:8px}
.empty-btn:hover{background:var(--acc-d)}
</style>
</head>
<body>
<header><div class="wrap"><nav>
<a href="index.html" class="cart-icon-btn nav-back-icon" aria-label="Weiter einkaufen" title="Weiter einkaufen">
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="11 18 5 12 11 6"/></svg>
</a>
<a href="index.html" class="logo">🪵 Holzmanufaktur</a>
<span class="nav-spacer" aria-hidden="true"></span>
</nav></div></header>

<main class="wrap">
<h1>Dein Warenkorb</h1>
<div class="layout">
  <div>
    <div class="section" id="progressBox" style="display:none">
      <p class="progress-msg" id="progressMsg"></p>
      <div class="progress-track">
        <div class="progress-fill" id="progressFill"></div>
        <div class="progress-mark" id="markShip" style="left:50%">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="7" width="12" height="9" rx="1"/><path d="M13 10h4.5L21 13.5V16h-8"/><circle cx="5.5" cy="17.5" r="1.6"/><circle cx="16.5" cy="17.5" r="1.6"/></svg>
        </div>
        <div class="progress-mark end" id="markGift">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="9" width="18" height="12" rx="1"/><path d="M3 13h18"/><path d="M12 9v12"/><path d="M12 9c-1.5-4-6-4.5-6-1.5 0 1.5 1.5 1.5 3 1.5"/><path d="M12 9c1.5-4 6-4.5 6-1.5 0 1.5-1.5 1.5-3 1.5"/></svg>
        </div>
      </div>
    </div>
    <div class="section" id="list"></div>
    <div class="section recommend" id="recommendBox">
      <div class="recommend-head">
        <p class="recommend-title">Damit dein neues Stück lange schön bleibt</p>
        <p class="recommend-sub">Ergänze deine Bestellung mit dieser kleinen Pflege-Empfehlung</p>
      </div>
      <div class="recommend-card" id="recommendCard"></div>
    </div>
  </div>
  <div class="summary" id="summary" style="display:none">
    <h2>Bestellübersicht</h2>
    <div class="discount">
      <input type="text" id="discountInput" placeholder="Rabattcode">
      <button onclick="applyDiscount()">Anwenden</button>
    </div>
    <p class="discount-msg" id="discountMsg" style="display:none"></p>
    <div class="row"><span>Zwischensumme</span><span id="sub">0,00 €</span></div>
    <div class="row" id="discountRow" style="display:none"><span id="discountLabel">Rabatt</span><span id="discountAmount"></span></div>
    <div class="row"><span>Versand</span><span id="ship">0,00 €</span></div>
    <div class="row total"><span>Gesamt</span><span id="total">0,00 €</span></div>
    <button class="checkout-btn" onclick="location.href='kasse.html'">Zur Kasse</button>
    <div class="trust">🔒 Sichere Bezahlung – SSL-verschlüsselte Verbindung</div>
  </div>
</div>
</main>

<script>
const KEY='warenkorbItems', FREE_SHIP=50, GIFT_AT=100, SHIP_COST=4.95, MAX_QTY=1000;
const CODES={'WILLKOMMEN10':0.10,'HOLZ5':0.05};
let discountPct=0, discountCode='';

const RECOMMENDATIONS=[
  {name:'Holzpflegeöl, 250 ml', price:9.90, icon:'🧴'},
  {name:'Filzgleiter-Set, 8 Stück', price:6.50, icon:'🟤'},
  {name:'Pflegetuch für Holzoberflächen', price:4.90, icon:'🧽'},
  {name:'Reinigungsspray für Holzmöbel', price:8.50, icon:'🧼'}
];

const eur=n=>n.toFixed(2).replace('.',',')+' €';

// Option 1 Icon: Beide Schnüre schwingen nach links
const SURPRISE_ICON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="width:1.2em;height:1.2em;vertical-align:-3px;margin-right:6px"><path d="M8.5 3C6 3 4 5.2 4 8c0 3.5 4.5 7.5 4.5 7.5S13 11.5 13 8c0-2.8-2-5-4.5-5z"/><path d="M14.5 6c1.9 0 3.5 1.6 3.5 3.8 0 2.8-3.5 5.7-3.5 5.7s-1.3-1.1-2.3-2.5"/><path d="M8.5 15.5l-0.8 1.5h1.6z"/><path d="M7.7 17c-1 2-2 3-3.2 4"/><path d="M14.5 15.5l-0.8 1.5h1.6z"/><path d="M13.7 17c-1 2-2 3-3.2 4"/></svg>';

const load=()=>JSON.parse(localStorage.getItem(KEY))||[];
const save=c=>localStorage.setItem(KEY,JSON.stringify(c));

function mergeDuplicates(cart){
  const map=new Map();
  cart.forEach(it=>{
    if(map.has(it.name)) map.get(it.name).qty = Math.min(MAX_QTY, map.get(it.name).qty + (it.qty||1));
    else map.set(it.name,{...it, qty:Math.min(MAX_QTY, it.qty||1)});
  });
  return [...map.values()];
}

function applyDiscount(){
  const val=document.getElementById('discountInput').value.trim().toUpperCase();
  const msg=document.getElementById('discountMsg');
  if(CODES[val]){ discountPct=CODES[val]; discountCode=val; msg.textContent=`Code „${val}" wurde erfolgreich angewendet (-${CODES[val]*100}%).`; msg.style.color='#3f7d3f'; }
  else { discountPct=0; discountCode=''; msg.textContent='Dieser Code ist leider ungültig.'; msg.style.color='#c0392b'; }
  msg.style.display='block';
  render();
}

function sizeQty(el){
  const len=String(el.value).length;
  el.style.width=Math.max(2.5, len+0.8)+'ch';
}

function onQtyInput(el, i){
  sizeQty(el);

  const raw=parseInt(el.value,10);
  if(isNaN(raw)) return; // Feld gerade leer/im Tippen – onchange korrigiert das später

  let val=raw;
  if(val>MAX_QTY){ val=MAX_QTY; el.value=MAX_QTY; sizeQty(el); }
  val=Math.max(1,val);

  const cart=mergeDuplicates(load());
  cart[i].qty=val;
  save(cart);

  const itemEl=el.closest('.item');
  itemEl.querySelector('.price').textContent=eur(cart[i].price*val);
  itemEl.querySelector('.qty button:last-child').disabled = val>=MAX_QTY;
  itemEl.querySelector('.qty-error').classList.toggle('show', val>=MAX_QTY);
  itemEl.classList.toggle('limit-active', val>=MAX_QTY);

  updateSummary(cart);
}

function renderRecommendation(cart){
  const box=document.getElementById('recommendBox');
  if(cart.length!==1){ box.style.display='none'; return; }
  const currentName=cart[0].name;
  const options=RECOMMENDATIONS.filter(r=>r.name!==currentName);
  const pick=options[0];
  if(!pick){ box.style.display='none'; return; }
  document.getElementById('recommendCard').innerHTML=`
    <div class="thumb">${pick.icon}</div>
    <div class="recommend-info">
      <p class="name">${pick.name}</p>
      <p class="unit">${eur(pick.price)}</p>
    </div>
    <button class="recommend-add" onclick="addRecommendation('${pick.name.replace(/'/g,"\\'")}')">In den Warenkorb</button>`;
  box.style.display='block';
}

function addRecommendation(name){
  const pick=RECOMMENDATIONS.find(r=>r.name===name);
  if(!pick) return;
  const cart=load();
  const existing=cart.find(it=>it.name===pick.name);
  if(existing) existing.qty=Math.min(MAX_QTY, (existing.qty||1)+1);
  else cart.push({name:pick.name, price:pick.price, icon:pick.icon, qty:1});
  save(cart);
  render();
}

function render(){
  let cart=mergeDuplicates(load());
  save(cart);
  const list=document.getElementById('list'), sum=document.getElementById('summary'), pbox=document.getElementById('progressBox');
  if(!cart.length){
    list.innerHTML=`
      <div class="empty">
        <div class="empty-icon">
          <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 7h12l-1 13H7L6 7Z"/><path d="M9 7V5a3 3 0 0 1 6 0v2"/><line x1="6" y1="7" x2="18" y2="7"/></svg>
        </div>
        <p class="empty-title">Dein Warenkorb ist noch leer</p>
        <p class="empty-sub">Entdecke unsere handgefertigten Holzprodukte und finde dein neues Lieblingsstück.</p>
        <a href="index.html" class="empty-btn">Produkte entdecken</a>
      </div>`;
    sum.style.display='none'; pbox.style.display='none'; document.getElementById('recommendBox').style.display='none';
    return;
  }
  sum.style.display='block'; pbox.style.display='block';

  list.innerHTML=cart.map((it,i)=>`
    <div class="item ${it.qty>=MAX_QTY?'limit-active':''}">
      <div class="item-main">
        <button class="remove" onclick="removeItem(${i})" title="Entfernen">✕</button>
        <div class="thumb">${it.icon||'📦'}</div>
        <div class="info"><p class="name">${it.name}</p><p class="unit">${eur(it.price)} / Stk.</p></div>
      </div>
      <div class="item-actions">
        <div class="qty-field">
          <div class="qty">
            <button onclick="changeQty(${i},-1)">−</button>
            <input type="number" inputmode="numeric" min="1" max="${MAX_QTY}" value="${it.qty}" oninput="onQtyInput(this, ${i})" onchange="setQty(${i}, this.value)">
            <button onclick="changeQty(${i},1)" ${it.qty>=MAX_QTY?'disabled':''}>+</button>
          </div>
          <p class="qty-error ${it.qty>=MAX_QTY?'show':''}"><span>Maximal 1.000 Stück</span><span>pro Artikel möglich</span></p>
        </div>
        <div class="price">${eur(it.price*it.qty)}</div>
      </div>
    </div>`).join('');

  list.querySelectorAll('.qty input').forEach(sizeQty);
  renderRecommendation(cart);
  updateSummary(cart);
}

function updateSummary(cart){
  const rawSub=cart.reduce((s,it)=>s+it.price*it.qty,0);
  const discountAmount=rawSub*discountPct;
  const sub=rawSub-discountAmount;
  const ship=rawSub>=FREE_SHIP?0:SHIP_COST;

  document.getElementById('sub').textContent=eur(rawSub);
  const dRow=document.getElementById('discountRow');
  if(discountPct>0){ dRow.style.display='flex'; document.getElementById('discountLabel').textContent=`Rabatt (${discountCode})`; document.getElementById('discountAmount').textContent='−'+eur(discountAmount); }
  else dRow.style.display='none';

  const shipEl=document.getElementById('ship');
  shipEl.textContent=ship===0?'Kostenlos':eur(ship);
  shipEl.className=ship===0?'free-ship':'';
  document.getElementById('total').textContent=eur(sub+ship);

  const pct=Math.min(100, rawSub/GIFT_AT*100);
  document.getElementById('progressFill').style.width=pct+'%';
  document.getElementById('markShip').classList.toggle('reached', rawSub>=FREE_SHIP);
  document.getElementById('markGift').classList.toggle('reached', rawSub>=GIFT_AT);
  const pmsg=document.getElementById('progressMsg');
  if(rawSub>=GIFT_AT) pmsg.innerHTML=`${SURPRISE_ICON}Exklusive Überraschung freigeschaltet!`;
  else if(rawSub>=FREE_SHIP) pmsg.textContent=`✓ Kostenloser Versand gesichert – nur noch ${eur(GIFT_AT-rawSub)} bis zu deiner exklusiven Überraschung!`;
  else pmsg.textContent=`Nur noch ${eur(FREE_SHIP-rawSub)} bis zum kostenlosen Versand`;
}

function changeQty(i,d){ const c=mergeDuplicates(load()); c[i].qty=Math.max(1,Math.min(MAX_QTY,c[i].qty+d)); save(c); render(); }

function setQty(i,val,refocus){
  const c=mergeDuplicates(load());
  let q=parseInt(val,10);
  if(isNaN(q)||q<1) q=1;
  if(q>MAX_QTY) q=MAX_QTY;
  c[i].qty=q;
  save(c);
  render();
  if(refocus){
    const input=document.querySelectorAll('.qty input')[i];
    if(input){
      input.focus();
      input.setSelectionRange(input.value.length, input.value.length);
    }
  }
}

function removeItem(i){ const c=mergeDuplicates(load()); c.splice(i,1); save(c); render(); }
render();
</script>
</body>
</html>
