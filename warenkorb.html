<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Warenkorb – Holzmanufaktur</title>
<style>
:root{--acc:#8b5a2b;--acc-d:#6b431f;--bg:#faf9f7;--line:#e5e1da;--text:#2a2521;--muted:#8a8078}
*{box-sizing:border-box}
body{font-family:system-ui,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);margin:0}
header{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
.wrap{max-width:1000px;margin:0 auto;padding:0 20px}
nav{display:flex;justify-content:space-between;align-items:center;padding:16px 0}
.logo{font-weight:700;color:var(--acc-d);text-decoration:none;font-size:1.2rem}
.back{color:var(--text);text-decoration:none;font-size:.9rem}
.back:hover{color:var(--acc)}
h1{font-size:1.6rem;margin:32px 0 20px}
.layout{display:grid;grid-template-columns:1fr 320px;gap:32px;align-items:start}
@media(max-width:760px){.layout{grid-template-columns:1fr}}

.section{padding:20px 0;border-bottom:1px solid var(--line)}
.section:last-child{border-bottom:none}

.progress-msg{font-size:.9rem;margin:0 0 10px;font-weight:600}
.progress-track{position:relative;height:8px;background:#f1ede6;border-radius:99px}
.progress-fill{height:100%;background:var(--acc);border-radius:99px;transition:width .4s ease}
.progress-mark{position:absolute;top:-6px;width:20px;height:20px;border-radius:50%;background:var(--bg);border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:.7rem;transform:translateX(-50%)}
.progress-mark.reached{border-color:var(--acc);background:var(--acc)}

.item{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:16px 0}
.item+.item{border-top:1px solid var(--line)}
.item-main{display:flex;align-items:center;gap:14px;flex:1 1 220px;min-width:0}
.remove{flex:0 0 auto;width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:#fff;color:var(--muted);cursor:pointer;font-size:1rem;line-height:1;display:flex;align-items:center;justify-content:center}
.remove:hover{background:#fcebea;border-color:#e3a7a1;color:#c0392b}
.thumb{flex:0 0 auto;width:60px;height:60px;border-radius:8px;background:#f1ede6;display:flex;align-items:center;justify-content:center;font-size:1.4rem}
.info{min-width:0}
.name{font-weight:600;margin:0 0 4px}
.unit{color:var(--muted);font-size:.85rem;margin:0}
.item-actions{display:flex;align-items:center;gap:22px;margin-left:auto}

/* Mengenauswahl: dezente +/- Buttons in derselben Farbe wie die Zahl, keine Trennlinie, Feld wächst mit der Ziffernzahl */
.qty{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.qty button{width:30px;height:34px;border:none;background:#fff;cursor:pointer;font-size:.95rem;color:var(--muted);flex:0 0 auto}
.qty button:hover{color:var(--text)}
.qty input{height:34px;width:2.5ch;min-width:2.5ch;text-align:center;font-size:.9rem;border:none;background:#fff;padding:0;color:var(--text);-moz-appearance:textfield}
.qty input::-webkit-outer-spin-button,.qty input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.qty input:focus{outline:none;background:#f7f4ef}
.price{font-weight:700;min-width:70px;text-align:right}
@media(max-width:480px){.item-actions{width:100%;justify-content:space-between;margin-left:0}}

.summary{padding:0}
@media(min-width:761px){.summary{border-left:1px solid var(--line);padding-left:32px}}
@media(max-width:760px){.summary{border-top:1px solid var(--line);padding-top:24px;margin-top:8px}}
.summary h2{font-size:1.1rem;margin:0 0 16px}
.discount{display:flex;gap:8px;margin-bottom:16px}
.discount input{flex:1;padding:9px 10px;border:1px solid var(--line);border-radius:6px;font-size:.88rem}
.discount button{padding:9px 14px;border:1px solid var(--acc);background:#fff;color:var(--acc-d);border-radius:6px;font-weight:600;font-size:.85rem;cursor:pointer}
.discount button:hover{background:#f7f0e8}
.discount-msg{font-size:.8rem;margin:-8px 0 14px}
.row{display:flex;justify-content:space-between;font-size:.92rem;margin-bottom:10px;color:var(--muted)}
.row.total{color:var(--text);font-weight:700;font-size:1.15rem;border-top:1px solid var(--line);padding-top:14px;margin-top:14px}
.free-ship{color:#3f7d3f;font-weight:600}
.checkout-btn{width:100%;background:var(--acc);color:#fff;border:none;padding:14px;border-radius:8px;font-weight:700;font-size:1rem;cursor:pointer;margin-top:16px}
.checkout-btn:hover{background:var(--acc-d)}
.trust{font-size:.78rem;color:var(--muted);text-align:center;margin-top:12px}
.empty{text-align:center;padding:60px 20px;color:var(--muted)}
</style>
</head>
<body>
<header><div class="wrap"><nav>
<a href="index.html" class="logo">🪵 Holzmanufaktur</a>
<a href="index.html" class="back">← Weiter einkaufen</a>
</nav></div></header>

<main class="wrap">
<h1>Dein Warenkorb</h1>
<div class="layout">
  <div>
    <div class="section" id="progressBox" style="display:none">
      <p class="progress-msg" id="progressMsg"></p>
      <div class="progress-track">
        <div class="progress-fill" id="progressFill"></div>
        <div class="progress-mark" id="markShip" style="left:50%">🚚</div>
        <div class="progress-mark" id="markGift" style="left:100%">🎁</div>
      </div>
    </div>
    <div class="section" id="list"></div>
  </div>
  <div class="summary" id="summary" style="display:none">
    <h2>Zusammenfassung</h2>
    <div class="discount">
      <input type="text" id="discountInput" placeholder="Rabattcode">
      <button onclick="applyDiscount()">Anwenden</button>
    </div>
    <p class="discount-msg" id="discountMsg" style="display:none"></p>
    <div class="row"><span>Zwischensumme</span><span id="sub">0,00 €</span></div>
    <div class="row" id="discountRow" style="display:none"><span id="discountLabel">Rabatt</span><span id="discountAmount"></span></div>
    <div class="row"><span>Versand</span><span id="ship">0,00 €</span></div>
    <div class="row total"><span>Gesamt</span><span id="total">0,00 €</span></div>
    <button class="checkout-btn" onclick="location.href='kasse.html'">Zur Kasse</button>
    <div class="trust">🔒 Sichere Bezahlung · SSL-verschlüsselt</div>
  </div>
</div>
</main>

<script>
const KEY='warenkorbItems', FREE_SHIP=50, GIFT_AT=100, SHIP_COST=4.95;
const CODES={'WILLKOMMEN10':0.10,'HOLZ5':0.05}; // Demo-Codes; in echt serverseitig prüfen
let discountPct=0, discountCode='';
const eur=n=>n.toFixed(2).replace('.',',')+' €';
const load=()=>JSON.parse(localStorage.getItem(KEY))||[];
const save=c=>localStorage.setItem(KEY,JSON.stringify(c));

function mergeDuplicates(cart){
  const map=new Map();
  cart.forEach(it=>{
    if(map.has(it.name)) map.get(it.name).qty += (it.qty||1);
    else map.set(it.name,{...it, qty:it.qty||1});
  });
  return [...map.values()];
}

function applyDiscount(){
  const val=document.getElementById('discountInput').value.trim().toUpperCase();
  const msg=document.getElementById('discountMsg');
  if(CODES[val]){ discountPct=CODES[val]; discountCode=val; msg.textContent=`Code "${val}" angewendet (-${CODES[val]*100}%)`; msg.style.color='#3f7d3f'; }
  else { discountPct=0; discountCode=''; msg.textContent='Ungültiger Code'; msg.style.color='#c0392b'; }
  msg.style.display='block';
  render();
}

function sizeQty(el){
  const len=String(el.value).length;
  el.style.width=Math.max(2, len+0.8)+'ch';
}

function render(){
  let cart=mergeDuplicates(load());
  save(cart);
  const list=document.getElementById('list'), sum=document.getElementById('summary'), pbox=document.getElementById('progressBox');
  if(!cart.length){ list.innerHTML='<div class="empty">Dein Warenkorb ist leer.</div>'; sum.style.display='none'; pbox.style.display='none'; return; }
  sum.style.display='block'; pbox.style.display='block';

  list.innerHTML=cart.map((it,i)=>`
    <div class="item">
      <div class="item-main">
        <button class="remove" onclick="removeItem(${i})" title="Entfernen">✕</button>
        <div class="thumb">${it.icon||'📦'}</div>
        <div class="info"><p class="name">${it.name}</p><p class="unit">${eur(it.price)} / Stk.</p></div>
      </div>
      <div class="item-actions">
        <div class="qty">
          <button onclick="changeQty(${i},-1)">−</button>
          <input type="number" inputmode="numeric" min="1" value="${it.qty}" oninput="sizeQty(this)" onchange="setQty(${i}, this.value)" onclick="this.select()">
          <button onclick="changeQty(${i},1)">+</button>
        </div>
        <div class="price">${eur(it.price*it.qty)}</div>
      </div>
    </div>`).join('');

  list.querySelectorAll('.qty input').forEach(sizeQty);

  const rawSub=cart.reduce((s,it)=>s+it.price*it.qty,0);
  const discountAmount=rawSub*discountPct;
  const sub=rawSub-discountAmount;
  const ship=rawSub>=FREE_SHIP?0:SHIP_COST;

  document.getElementById('sub').textContent=eur(rawSub);
  const dRow=document.getElementById('discountRow');
  if(discountPct>0){ dRow.style.display='flex'; document.getElementById('discountLabel').textContent=`Rabatt (${discountCode})`; document.getElementById('discountAmount').textContent='−'+eur(discountAmount); }
  else dRow.style.display='none';

  const shipEl=document.getElementById('ship');
  shipEl.textContent=ship===0?'Kostenlos':eur(ship);
  shipEl.className=ship===0?'free-ship':'';
  document.getElementById('total').textContent=eur(sub+ship);

  const pct=Math.min(100, rawSub/GIFT_AT*100);
  document.getElementById('progressFill').style.width=pct+'%';
  document.getElementById('markShip').classList.toggle('reached', rawSub>=FREE_SHIP);
  document.getElementById('markGift').classList.toggle('reached', rawSub>=GIFT_AT);
  const pmsg=document.getElementById('progressMsg');
  if(rawSub>=GIFT_AT) pmsg.textContent='🎉 Du hast eine Überraschung und eine kostenlose Lieferung erhalten!';
  else if(rawSub>=FREE_SHIP) pmsg.textContent=`✓ Gratis Versand freigeschaltet – noch ${eur(GIFT_AT-rawSub)} bis zur Überraschung`;
  else pmsg.textContent=`Noch ${eur(FREE_SHIP-rawSub)} bis zum gratis Versand`;
}
function changeQty(i,d){ const c=mergeDuplicates(load()); c[i].qty=Math.max(1,c[i].qty+d); save(c); render(); }
function setQty(i,val){
  const c=mergeDuplicates(load());
  let q=parseInt(val,10);
  if(isNaN(q)||q<1) q=1;
  c[i].qty=q;
  save(c);
  render();
}
function removeItem(i){ const c=mergeDuplicates(load()); c.splice(i,1); save(c); render(); }
render();
</script>
</body>
</html>
