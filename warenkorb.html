<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Warenkorb – Holzmanufaktur</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- HIER HAT DER HEADER DIE KLASSE .sticky-header, DAMIT ER MITSCROLLT -->
<header class="sticky-header">
  <div class="wrap">
    <nav>
      <a href="index.html" class="nav-back">← Weiter einkaufen</a>
      <a href="index.html" class="logo">🪵 Holzmanufaktur</a>
      <span class="nav-spacer" aria-hidden="true"></span>
    </nav>
  </div>
</header>

<main class="wrap">
  <h1>Dein Warenkorb</h1>
  <div id="cartContent">
    <!-- Wird dynamisch befüllt -->
  </div>
</main>

<script>
const KEY = 'warenkorbItems';
const cart = JSON.parse(localStorage.getItem(KEY)) || [];
const container = document.getElementById('cartContent');

function renderCart() {
  if (!cart.length) {
    container.innerHTML = `
      <div class="not-found">
        <h2>Dein Warenkorb ist leer</h2>
        <p>Entdecke unsere handgefertigten Produkte aus Holz.</p>
        <a href="index.html" class="btn btn-primary" style="display:inline-block; width:auto;">Zum Shop</a>
      </div>
    `;
    return;
  }

  const sub = cart.reduce((s, it) => s + it.price * (it.qty || 1), 0);
  
  container.innerHTML = `
    <div class="layout">
      <div>
        ${cart.map((it, idx) => `
          <div class="mini-item" style="padding: 14px 0; border-bottom: 1px solid var(--line);">
            <div class="mini-item-left" style="gap: 14px;">
              <div class="mini-thumb" style="width: 50px; height: 50px;">${it.icon || '📦'}</div>
              <div>
                <strong>${it.name}</strong>
                <div style="font-size: 0.8rem; color: var(--muted); margin-top: 2px;">Menge: ${it.qty || 1}</div>
              </div>
            </div>
            <div style="text-align: right;">
              <strong>${(it.price * (it.qty || 1)).toFixed(2).replace('.', ',')} €</strong>
              <div><button onclick="removeItem(${idx})" style="background:none; border:none; color:var(--err); font-size:0.75rem; cursor:pointer; margin-top:4px;">Entfernen</button></div>
            </div>
          </div>
        `).join('')}
      </div>
      <div class="summary" style="position:static;">
        <div class="row total"><span>Gesamtsumme</span><span>${sub.toFixed(2).replace('.', ',')} €</span></div>
        <button class="pay-btn" onclick="location.href='kasse.html'">Weiter zur Kasse</button>
      </div>
    </div>
  `;
}

function removeItem(index) {
  cart.splice(index, 1);
  localStorage.setItem(KEY, JSON.stringify(cart));
  renderCart();
}

renderCart();
</script>

</body>
</html>
